name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk backbuttonmapper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: backbuttonmapper-apk
          path: backbuttonmapper.apk
      # Keep a "latest" pre-release pointing at the newest build, so the APK has a stable
      # direct link: releases/download/latest/backbuttonmapper.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Move the tag instead of deleting it: deleting and recreating it in one go can leave
          # the new release as an untagged draft, which breaks the direct link.
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "latest") | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release create latest backbuttonmapper.apk \
            --verify-tag \
            --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}."
